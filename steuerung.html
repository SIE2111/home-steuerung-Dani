<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zuhause">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1115">
<title>Zuhause</title>
<style>
  :root{
    --bg:#0F1115; --card:#1A1D24; --card2:#242833; --line:#2C313D;
    --text:#F3F4F6; --muted:#8E94A3; --accent:#F7B83D; --accent2:#FF8A3D; --err:#E5646B; --ok:#4CC38A; --warn:#F2B84B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{min-height:100vh;
    background:radial-gradient(900px 420px at 80% -10%,#2A2113 0%,transparent 60%),var(--bg);
    padding:max(18px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
  .wrap{max-width:760px;margin:0 auto}
  header{display:flex;align-items:flex-start;justify-content:space-between;margin:6px 2px 18px}
  h1{font-size:28px;margin:0;font-weight:750;letter-spacing:-.02em}
  .hello{color:var(--muted);font-size:14px;margin-top:3px}
  .status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-top:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--err)}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}

  /* Wetter */
  .weather{background:linear-gradient(135deg,#1F2A3D 0%,#1A1D24 70%);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px}
  .wmain{display:flex;align-items:center;gap:14px}
  .wi{font-size:48px;line-height:1}
  .wt{font-size:36px;font-weight:750;letter-spacing:-.02em;line-height:1}
  .wc{font-size:14px;color:var(--muted);margin-top:4px}
  .wd{margin-left:auto;display:grid;grid-template-columns:auto auto;gap:3px 12px;font-size:13px;color:var(--muted);text-align:right}
  .wd b{color:var(--text);font-weight:600}
  .wf{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .wf div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
  .wf .e{font-size:24px;margin:4px 0}
  .wf b{color:var(--text);font-weight:600}

  /* Hinweise */
  .notes{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:12px}
  .notes.bad{border-color:#6A2F36;background:linear-gradient(135deg,#2B1B1F,#1A1D24)}
  .notes.warn{border-color:#5A4720;background:linear-gradient(135deg,#2B2416,#1A1D24)}
  .nh{font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
  .nrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .nrow:first-of-type{margin-top:8px}
  .nd{width:9px;height:9px;border-radius:50%;flex:none}
  .nd.fault{background:var(--err)} .nd.warn{background:var(--warn)} .nd.info{background:#6AA9FF}
  .nt{flex:1;min-width:0} .nt small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .nx{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer}

  .summary{display:flex;align-items:center;justify-content:space-between;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:16px}
  .summary .big{font-size:18px;font-weight:650}
  .summary .small{font-size:13px;color:var(--muted);margin-top:2px}
  .pill{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:14px;
    padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
  .pill:active{background:var(--accent);color:#14161B;border-color:var(--accent)}

  .tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px 6px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;
    padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .tabs.sub{padding-top:0}
  .tab.sm{padding:7px 14px;font-size:13px;background:transparent}
  .tab.sm.act{background:var(--card2);color:var(--accent);border-color:var(--accent)}
  .tab.act{background:var(--accent);color:#16130B;border-color:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;
    display:flex;flex-direction:column;gap:10px;min-height:128px;position:relative;overflow:hidden;
    transition:background .25s,border-color .25s,box-shadow .25s}
  .tile.on{background:linear-gradient(150deg,#3A2E14 0%,#241F17 55%,#1A1D24 100%);border-color:#5A4720;
    box-shadow:0 8px 28px -12px rgba(247,184,61,.45)}
  .tile.unavailable{opacity:.4}
  .row{display:flex;align-items:center;justify-content:space-between}
  .ico{width:44px;height:44px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .25s}
  .ico svg{width:24px;height:24px;fill:currentColor}
  .tile.on .ico{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1B1405}
  .tog{width:46px;height:28px;border-radius:14px;background:var(--card2);border:1px solid var(--line);position:relative;padding:0;cursor:pointer;flex:none}
  .tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#C9CDD6;transition:transform .2s,background .2s}
  .tile.on .tog{background:var(--accent);border-color:var(--accent)}
  .tile.on .tog::after{transform:translateX(18px);background:#fff}
  .nm{font-size:15px;font-weight:650;line-height:1.2;word-break:break-word}
  .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .tile.on .sub{color:#E7C985}
  .spacer{flex:1}
  input[type=range]{width:100%;height:30px;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:rgba(255,255,255,.12)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-7px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:rgba(255,255,255,.12)}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0}
  .btns{display:flex;gap:8px}
  .btn{flex:1;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 0;font-size:16px;cursor:pointer}
  .btn:active{background:var(--accent);color:#14161B}
  .go{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .go:active{background:var(--accent);color:#14161B}

  /* Zeit */
  .zh{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:6px 4px 10px}
  .zl{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .zrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
  .zrow .nt{font-size:15px;font-weight:600}
  .zrow.off .nt{opacity:.55}
  .zdel{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px}
  .zform{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .zform label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
  .zform select,.zform input[type=time],.zform input[type=number]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:left;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;width:100%}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .day{flex:1;min-width:38px;background:var(--card2);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 0;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
  .day.on{background:var(--accent);color:#16130B;border-color:var(--accent)}
  .primary{background:var(--accent);color:#16130B;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:700;cursor:pointer}

  @media(min-width:900px){
    .wrap{max-width:1360px}
    #app:not([hidden]){display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
    .side{position:sticky;top:12px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
    .zl{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
    .zform{max-width:560px}
    .tabs{padding-left:0;padding-right:0;margin-left:0;margin-right:0;flex-wrap:wrap;overflow:visible}
  }
  @media(min-width:900px) and (orientation:landscape){.wf{margin-top:12px}}
  #toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:#3A1D22;border:1px solid #7A2F38;color:#FFD7DB;padding:12px 16px;border-radius:14px;font-size:14px;max-width:90vw;
    opacity:0;pointer-events:none;transition:all .25s;z-index:10}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.okk{background:#16301F;border-color:#2F7A45;color:#D2F5DD}

  footer{margin-top:34px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px}
  footer .fb{display:flex;gap:8px}
  footer button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:8px 14px;font-size:13px;cursor:pointer}
  #msg{text-align:center;color:var(--muted);margin-top:70px;font-size:16px;line-height:1.5;padding:0 12px}
  #msg b{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="greet">Zuhause</h1><div class="hello" id="hello"></div></div>
    <div class="status"><span class="dot" id="dot"></span><span id="stxt">verbinde …</span></div>
  </header>
  <div id="msg">Anmeldung bei Home Assistant …</div>
  <div id="app" hidden>
    <aside class="side"><div class="weather" id="weather" hidden></div>
    <div class="notes" id="notes" hidden></div>
    <div class="summary">
      <div><div class="big" id="sumBig"></div><div class="small" id="sumSmall"></div></div>
      <button class="pill" id="allOff">Alles aus</button>
    </div></aside>
    <div class="mainc">
    <nav class="tabs" id="tabs"></nav>
    <nav class="tabs sub" id="tabs2" hidden></nav>
    <main class="grid" id="grid"></main>
    <section id="zeit" hidden>
      <div class="zh">Zeitschaltuhren &amp; Automatisierungen</div>
      <div class="zl" id="zlist"></div>
      <div class="zh">Neue Zeitschaltuhr</div>
      <div class="zform" id="zform"></div>
    </section>
    </div>
  </div>
  <div id="toast"></div>
  <footer>
    <span><span id="who"></span><span id="ver" style="opacity:.6"></span></span>
    <span class="fb"><button id="upd" hidden>Aktualisieren</button><button id="logout" hidden>Abmelden</button></span>
  </footer>
</div>

<script>
/* =====================================================================
   EINSTELLUNGEN (optional) – die Räume kommen automatisch aus den
   Bereichen von Home Assistant.
   ===================================================================== */
const UMBENENNEN = {
  // 'light.deckenlicht_kuche_dimmbar_l1': 'Decke',
};
const VERSTECKEN = [
  'switch.0x18690afffe69d31e',
  // 'light.deckenlicht_kuche_dimmbar_l2',
];
// Diese Entitäten werden nie als Geräte-Kachel angezeigt (Technik)
const AUSSCHLUSS = [
  /^switch\.(szenenschalter|schalter)_/,
  /permit_join|bridge/i,
  /backlight|vibration|momentary|countdown|indicator|induction|power_on|child_lock|led_|relay_status/i,
];
// Alles, was in Home Assistant im Bereich oder auf der Etage "Schalter" liegt, wird nie gezeigt
const SCHALTER_BEREICH = /^schalter$/i;
// Dieser Reiter erscheint ganz hinten und nicht unter "Alle"
const SONSTIGES = 'Sonstiges';
const GERAETE_DOMAINS = ['light', 'switch', 'cover', 'input_boolean'];
const SZENEN_DOMAINS = ['scene', 'script'];
const UPDATE_SKRIPT = 'script.steuerung_aktualisieren';
// Optional: feste Wetter-Koordinaten (sonst Standort aus Home Assistant)
const WETTER_ORT = null; // z. B. { lat: 48.2, lon: 16.37 }
const BATTERIE_WARNUNG = 20; // Prozent
// Gruppen (Reiter): kommen aus den Etagen von Home Assistant. Ohne Etage -> 'Sonstiges'.
// Hier kann ein Raum (Bereichsname) fest einer Gruppe zugeordnet werden:
const AREA_GRUPPE = { 'Terrasse': 'Terrasse' };
const GRUPPEN_REIHENFOLGE = ['Obergeschoss', 'Untergeschoss'];
/* ===================================================================== */

const VERSION = 'v4.18 · 13.11. 08:00';
const KEY = 'steuerung_tokens_v1';
const TABKEY = 'steuerung_tab_v1';
const ORIGIN = location.origin;
const CLIENT_ID = ORIGIN + '/';
const REDIRECT = ORIGIN + location.pathname;
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let pending = {}, toastTimer = null;
const ROOM = {}, DEVNAME = {};
let S = {}, AREAS = [], NOTES = [], WEATHER = null, HACFG = null, cards = {}, current = 'alle';
let ws = null, wsId = 0, tokens = null, userName = '', retry = 0, haveStates = false, haveAreas = false;
let idNotes = 0, notesTimer = null, weatherTimer = null, issueTimer = null;

const P = {
  light: 'M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z',
  switch: 'M16.01 7L16 3h-2v4h-4V3H8v4h-.01C7 6.99 6 7.99 6 8.99v5.49L9.5 18v3h5v-3l3.5-3.51v-5.5c0-1-1-2-1.99-1.99z',
  cover: 'M3 3v18h18V3H3zm8 16H5v-6h6v6zm0-8H5V5h6v6zm8 8h-6v-6h6v6zm0-8h-6V5h6v6z',
  scene: 'M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z',
  script: 'M8 5v14l11-7z',
  input_boolean: 'M16.01 7L16 3h-2v4h-4V3H8v4h-.01C7 6.99 6 7.99 6 8.99v5.49L9.5 18v3h5v-3l3.5-3.51v-5.5c0-1-1-2-1.99-1.99z',
};
const svg = (dom) => '<svg viewBox="0 0 24 24"><path d="' + (P[dom] || P.switch) + '"/></svg>';

/* ---------- Anmeldung (OAuth über Home Assistant, pro Benutzer) ---------- */
async function tokenRequest(body) {
  const r = await fetch('/auth/token', { method: 'POST', body: new URLSearchParams(body) });
  if (!r.ok) throw new Error('Token ' + r.status);
  return r.json();
}
function saveTokens(t) { localStorage.setItem(KEY, JSON.stringify(t)); }
function goLogin() {
  localStorage.removeItem(KEY);
  location.href = '/auth/authorize?' + new URLSearchParams({
    client_id: CLIENT_ID, redirect_uri: REDIRECT, state: btoa(REDIRECT)
  });
}
async function getTokens() {
  const p = new URLSearchParams(location.search);
  if (p.get('code')) {
    const t = await tokenRequest({ grant_type: 'authorization_code', code: p.get('code'), client_id: CLIENT_ID });
    t.expires = Date.now() + t.expires_in * 1000;
    saveTokens(t);
    history.replaceState({}, '', REDIRECT);
    return t;
  }
  let t = null;
  try { t = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!t) { goLogin(); return new Promise(() => {}); }
  if (Date.now() > t.expires - 30000) {
    try {
      const n = await tokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh_token, client_id: CLIENT_ID });
      t = Object.assign({}, t, n, { expires: Date.now() + n.expires_in * 1000 });
      saveTokens(t);
    } catch (e) { goLogin(); return new Promise(() => {}); }
  }
  return t;
}

/* ---------- Verbindung ---------- */
function send(msg) { msg.id = ++wsId; ws.send(JSON.stringify(msg)); return msg.id; }
function call(domain, service, data, eid) {
  if (!ws || ws.readyState !== 1) { toast('Keine Verbindung zu Home Assistant'); return; }
  const m = { type: 'call_service', domain, service, service_data: data || {} };
  if (eid) m.target = { entity_id: eid };
  const id = send(m);
  pending[id] = domain + '.' + service + ' ' + (Array.isArray(eid) ? eid.join(', ') : (eid || ''));
}
function toast(text, ok) {
  const t = $('#toast'); t.textContent = text; t.classList.toggle('okk', !!ok); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 6000);
}
function setStatus(ok, text) {
  $('#dot').className = 'dot' + (ok ? ' ok' : '');
  $('#stxt').textContent = text;
}
function pollNotes() { if (ws && ws.readyState === 1) idNotes = send({ type: 'persistent_notification/get' }); }

const TEMPLATE = "{% set ns = namespace(r=[]) %}{% for s in states if s.domain in ['light','switch','cover','input_boolean','scene','script'] %}{% set a = area_id(s.entity_id) %}{% if a %}{% set f = floor_id(s.entity_id) %}{% set ns.r = ns.r + [[s.entity_id, a, area_name(a), (floor_name(f) if f else none), (device_attr(s.entity_id, 'name_by_user') or device_attr(s.entity_id, 'name'))]] %}{% endif %}{% endfor %}{{ ns.r | to_json }}";

async function connect() {
  try { tokens = await getTokens(); } catch (e) { showMsg('Anmeldung fehlgeschlagen.<br><b>' + esc(e.message) + '</b>'); return; }
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/api/websocket');
  let idStates = 0, idUser = 0, idTpl = 0, idCfg = 0;
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'auth_required') {
      ws.send(JSON.stringify({ type: 'auth', access_token: tokens.access_token }));
    } else if (m.type === 'auth_invalid') {
      goLogin();
    } else if (m.type === 'auth_ok') {
      retry = 0; haveStates = false; haveAreas = false;
      setStatus(true, 'verbunden');
      idStates = send({ type: 'get_states' });
      idUser = send({ type: 'auth/current_user' });
      idCfg = send({ type: 'get_config' });
      idTpl = send({ type: 'render_template', template: TEMPLATE, timeout: 8 });
      send({ type: 'subscribe_events', event_type: 'state_changed' });
      pollNotes();
      clearInterval(notesTimer); notesTimer = setInterval(pollNotes, 60000);
    } else if (m.type === 'result' && pending[m.id]) {
      console.log('[steuerung] antwort', pending[m.id], JSON.stringify(m));
      if (!m.success) toast('Fehler bei ' + pending[m.id] + ': ' + ((m.error && m.error.message) || 'unbekannt'));
      delete pending[m.id];
    } else if (m.type === 'result' && m.id === idStates && m.success) {
      S = {}; m.result.forEach((s) => (S[s.entity_id] = s));
      haveStates = true; maybeBuild();
    } else if (m.type === 'result' && m.id === idCfg && m.success) {
      HACFG = m.result; loadWeather();
    } else if (m.type === 'result' && m.id === idNotes) {
      const r = m.success ? m.result : null;
      NOTES = !r ? [] : Array.isArray(r) ? r : Object.keys(r).map((k) => Object.assign({ notification_id: k }, r[k]));
      scheduleIssues();
    } else if (m.type === 'result' && m.id === idTpl && !m.success) {
      haveAreas = true; AREAS = []; maybeBuild();
    } else if (m.type === 'event' && m.id === idTpl) {
      let r = m.event.result;
      try { if (typeof r === 'string') r = JSON.parse(r); } catch (e) { r = []; }
      const byArea = {};
      (Array.isArray(r) ? r : []).forEach((x) => {
        if (!Array.isArray(x)) return;
        const ar = byArea[x[1]] = byArea[x[1]] || { id: x[1], name: x[2], floor: x[3], entities: [] };
        ar.entities.push(x[0]); ROOM[x[0]] = x[2]; if (x[4]) DEVNAME[x[0]] = x[4];
      });

function computeIssues() {

// Schalter, deren Name nach Licht klingt, zählen wie Lichter
const LICHT_NAME = /licht|lampe|leuchte|strahler|spot/i;
function isLight(e) { return e.startsWith('light.') || (e.startsWith('switch.') && LICHT_NAME.test(nameOf(e))); }
function lightsOn(list) { return list.filter((e) => isLight(e) && S[e] && S[e].state === 'on'); }
function updateSummary() {
  const all = entitiesOf('gesamt');
  const on = lightsOn(all).length;
  $('#sumBig').textContent = on === 0 ? 'Alle Lichter aus' : on + (on === 1 ? ' Licht an' : ' Lichter an');
  $('#sumSmall').textContent = all.filter(isLight).length + ' Lichter insgesamt';
}

/* ---------- Zeitsteuerung ---------- */
const TAGE = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const TAGE_DE = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
let showPaused = false, currentRoom = 'alle';
let zf = { eid: '', act: 'off', pct: 50, time: '22:00', days: [true, true, true, true, true, true, true] };

function renderZeitList() {
  const box = $('#zlist'); if (!box) return;
  const autos = Object.keys(S).filter((e) => e.startsWith('automation.')).sort((a, b) => nameOf(a).localeCompare(nameOf(b), 'de'));
  const scheds = Object.keys(S).filter((e) => e.startsWith('schedule.'));
  let html = '';
  const paused = autos.filter((e) => S[e].state !== 'on');
  autos.filter((e) => showPaused || S[e].state === 'on').forEach((e) => {
    const st = S[e], a = st.attributes || {}, mine = !!a.id;
    html += '<div class="zrow ' + (st.state === 'on' ? '' : 'off') + '"><div class="nt">' + esc(nameOf(e).replace(/^Zeitschaltuhr:\s*/, '⏰ ')) +
      '<small>zuletzt: ' + esc(rel(a.last_triggered)) + (st.state === 'on' ? '' : ' · pausiert') + '</small></div>' +
      (mine ? '<button class="zdel" data-del="' + esc(a.id) + '" data-nm="' + esc(nameOf(e)) + '">Löschen</button>' : '') +
      '<button class="tog" style="' + (st.state === 'on' ? 'background:var(--accent);border-color:var(--accent)' : '') + '" data-tg="' + esc(e) + '" aria-label="An/Aus"></button></div>';
  });
  scheds.forEach((e) => {
    const st = S[e], a = st.attributes || {};
    html += '<div class="zrow ' + (st.state === 'on' ? '' : 'off') + '"><div class="nt">🗓️ ' + esc(nameOf(e)) + '<small>' + (st.state === 'on' ? 'aktiv' : 'außerhalb') +
      (a.next_event ? ' · nächste Änderung ' + esc(rel(a.next_event).replace('vor', 'in')) : '') + '</small></div></div>';
  });
  if (!html) html = '<div style="color:var(--muted);padding:8px 4px">Keine aktiven Automatisierungen oder Zeitschaltuhren.</div>';
  if (paused.length) html += '<button class="zdel" id="zpa" style="align-self:flex-start">' + (showPaused ? 'Pausierte ausblenden' : 'Pausierte anzeigen (' + paused.length + ')') + '</button>';
  box.innerHTML = html;
  if ($('#zpa')) $('#zpa').onclick = () => { showPaused = !showPaused; renderZeitList(); };
  box.querySelectorAll('[data-tg]').forEach((b) => {
    // Schalter-Optik wie bei Geräten: Kreis
    b.style.position = 'relative';
    const on = S[b.dataset.tg] && S[b.dataset.tg].state === 'on';
    b.innerHTML = '<span style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:' + (on ? '#fff' : '#C9CDD6') + ';transform:translateX(' + (on ? 18 : 0) + 'px);transition:transform .2s"></span>';
    b.onclick = () => call('automation', 'toggle', {}, b.dataset.tg);
  });
  box.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => deleteAutomation(b.dataset.del, b.dataset.nm)));
}

function zeitTargets() {
  const out = [];
  Object.keys(S).forEach((e) => {
    const dom = e.split('.')[0];
    if ((GERAETE_DOMAINS.includes(dom) && visible(e)) || SZENEN_DOMAINS.includes(dom) && e !== UPDATE_SKRIPT) out.push(e);
  });
  return sortEnt(out);
}
function actionOptions(eid) {
  const dom = (eid || '').split('.')[0];
  if (dom === 'light') return [['on', 'Einschalten'], ['off', 'Ausschalten'], ['dim', 'Dimmen auf …']];
  if (dom === 'switch' || dom === 'input_boolean') return [['on', 'Einschalten'], ['off', 'Ausschalten']];
  if (dom === 'cover') return [['open', 'Öffnen'], ['close', 'Schließen']];
  if (dom === 'scene' || dom === 'script') return [['run', 'Starten']];
  return [['on', 'Einschalten']];
}
function renderZeitForm() {
  const box = $('#zform'); if (!box) return;
  const targets = zeitTargets();
  if (!zf.eid || !targets.includes(zf.eid)) zf.eid = targets[0] || '';
  const acts = actionOptions(zf.eid);
  if (!acts.some((a) => a[0] === zf.act)) zf.act = acts[0][0];
  let html = '<label>Gerät oder Szene<select id="zfE">' + targets.map((e) => '<option value="' + esc(e) + '"' + (e === zf.eid ? ' selected' : '') + '>' + esc(nameOf(e)) + '</option>').join('') + '</select></label>';
  html += '<label>Aktion<select id="zfA">' + acts.map((a) => '<option value="' + a[0] + '"' + (a[0] === zf.act ? ' selected' : '') + '>' + a[1] + '</option>').join('') + '</select></label>';
  if (zf.act === 'dim') html += '<label>Helligkeit in %<input type="number" id="zfP" min="1" max="100" value="' + zf.pct + '"></label>';
  html += '<label>Uhrzeit<input type="time" id="zfT" value="' + zf.time + '"></label>';
  html += '<label>Wochentage</label><div class="days">' + TAGE_DE.map((d, i) => '<div class="day' + (zf.days[i] ? ' on' : '') + '" data-d="' + i + '">' + d + '</div>').join('') + '</div>';
  html += '<button class="primary" id="zfS">Zeitschaltuhr speichern</button>';
  box.innerHTML = html;
  $('#zfE').onchange = (e) => { zf.eid = e.target.value; renderZeitForm(); };
  $('#zfA').onchange = (e) => { zf.act = e.target.value; renderZeitForm(); };
  if ($('#zfP')) $('#zfP').oninput = (e) => { zf.pct = Number(e.target.value) || 50; };
  $('#zfT').oninput = (e) => { zf.time = e.target.value; };
  box.querySelectorAll('.day').forEach((d) => (d.onclick = () => { const i = Number(d.dataset.d); zf.days[i] = !zf.days[i]; d.classList.toggle('on', zf.days[i]); }));
  $('#zfS').onclick = saveAutomation;
}
function dayText(days) {
  if (days.every(Boolean)) return 'täglich';
  if (days.slice(0, 5).every(Boolean) && !days[5] && !days[6]) return 'Mo–Fr';
  if (!days.slice(0, 5).some(Boolean) && days[5] && days[6]) return 'Sa, So';
  return TAGE_DE.filter((d, i) => days[i]).join(', ');
}
async function apiFetch(path, opts) {
  tokens = await getTokens();
  const r = await fetch(path, Object.assign({ headers: { Authorization: 'Bearer ' + tokens.access_token, 'Content-Type': 'application/json' } }, opts || {}));
  return r;
}
async function saveAutomation() {
  if (!zf.eid) { toast('Bitte ein Gerät wählen'); return; }
  if (!zf.days.some(Boolean)) { toast('Bitte mindestens einen Wochentag wählen'); return; }
  if (!zf.time) { toast('Bitte eine Uhrzeit wählen'); return; }
  const dom = zf.eid.split('.')[0];
  let action, actText;
  if (dom === 'scene') { action = { action: 'scene.turn_on', target: { entity_id: zf.eid } }; actText = 'starten'; }
  else if (dom === 'script') { action = { action: 'script.turn_on', target: { entity_id: zf.eid } }; actText = 'starten'; }
  else if (dom === 'cover') { action = { action: zf.act === 'open' ? 'cover.open_cover' : 'cover.close_cover', target: { entity_id: zf.eid } }; actText = zf.act === 'open' ? 'öffnen' : 'schließen'; }
  else if (zf.act === 'dim') { action = { action: 'light.turn_on', target: { entity_id: zf.eid }, data: { brightness_pct: Math.min(100, Math.max(1, zf.pct)) } }; actText = 'auf ' + zf.pct + ' %'; }
  else if (zf.act === 'off') { action = { action: dom + '.turn_off', target: { entity_id: zf.eid } }; actText = 'aus'; }
  else { action = { action: dom + '.turn_on', target: { entity_id: zf.eid } }; actText = 'ein'; }
  const days = TAGE.filter((d, i) => zf.days[i]);
  const cfg = {
    alias: 'Zeitschaltuhr: ' + nameOf(zf.eid) + ' ' + actText + ' · ' + zf.time + ' · ' + dayText(zf.days),
    description: 'Angelegt in der Steuer-App',
    triggers: [{ trigger: 'time', at: zf.time + ':00' }],
    conditions: days.length === 7 ? [] : [{ condition: 'time', weekday: days }],
    actions: [action],
    mode: 'single'
  };
  const id = 'steuerung_' + Date.now();
  try {
    const r = await apiFetch('/api/config/automation/config/' + id, { method: 'POST', body: JSON.stringify(cfg) });
    if (r.status === 401 || r.status === 403) { toast('Nur Administratoren können Zeitschaltuhren anlegen.'); return; }
    if (!r.ok) { toast('Speichern fehlgeschlagen (' + r.status + '): ' + (await r.text()).slice(0, 120)); return; }
    call('automation', 'reload', {});
    toast('Zeitschaltuhr gespeichert', true);
  } catch (e) { toast('Speichern fehlgeschlagen: ' + e.message); }
}
async function deleteAutomation(id, nm) {
  if (!confirm('„' + (nm || 'Automatisierung') + '“ endgültig löschen?\n\nDas lässt sich nicht rückgängig machen.')) return;
  try {
    const r = await apiFetch('/api/config/automation/config/' + id, { method: 'DELETE' });
    if (r.status === 401 || r.status === 403) { toast('Nur Administratoren können löschen.'); return; }
    if (!r.ok) { toast('Löschen fehlgeschlagen (' + r.status + ')'); return; }
    call('automation', 'reload', {});
    toast('Gelöscht', true);
  } catch (e) { toast('Löschen fehlgeschlagen: ' + e.message); }
}

function maybeBuild() {
  if (!haveStates || !haveAreas) return;
  $('#msg').hidden = true; $('#app').hidden = false; $('#logout').hidden = false;
  $('#upd').hidden = !S[UPDATE_SKRIPT];
  let saved = 'alle'; try { saved = localStorage.getItem(TABKEY) || 'alle'; } catch (e) {}
  const valid = ['alle', 'zeit'].concat(groups().map((r) => r.id)).concat(szenen().length ? ['szenen'] : []);
  current = valid.includes(saved) ? saved : 'alle';
  try { currentRoom = localStorage.getItem(TABKEY + 'r') || 'alle'; } catch (e) {}
  const gg = groups().find((x) => x.id === current);
  if (!gg || !gg.rooms.some((r) => r.id === currentRoom)) currentRoom = 'alle';
  renderTabs(); renderGrid(); renderIssues();
  if (!WEATHER) updateWeatherFromEntity();
}

$('#allOff').onclick = () => {
  const l = lightsOn(entitiesOf(current === 'alle' || current === 'szenen' || current === 'zeit' ? 'gesamt' : current));
  if (l.length) call('homeassistant', 'turn_off', {}, l);
};
$('#upd').onclick = () => {
  call('script', 'turn_on', {}, UPDATE_SKRIPT);
  toast('Aktualisierung läuft – Seite lädt gleich neu …', true);
  setTimeout(async () => {
    try { await fetch(location.pathname, { cache: 'reload' }); } catch (e) {}
    location.replace(location.pathname + '?v=' + Date.now());
  }, 8000);
};
$('#ver').textContent = ' · ' + VERSION;
$('#ver').style.cursor = 'pointer';
$('#ver').onclick = () => toast('Bereiche: ' + (AREAS.map((a) => a.name + ' [' + (a.ids || [a.id]).join('+') + '] → ' + (a.floor || 'keine Etage') + ' (' + (a.entities || []).length + ')').join(' | ') || 'keine'), true);
$('#logout').onclick = () => { localStorage.removeItem(KEY); location.reload(); };
connect();
</script>
</body>
</html>
